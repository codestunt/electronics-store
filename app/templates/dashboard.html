{% extends "layout.html" %}

{% block content %}
<div class="container mt-5 text-center">
  <!-- Welcome Header -->
  <h2 style="color: green; font-size: 2rem;">Welcome, {{ session['username'] }}!</h2>

  <!-- Subtext with consistent font size -->
  <p style="font-size: 1.1rem; margin-top: 15px;">
    Glad to have you at <strong>ElectroZone</strong>.
  </p>

  <!-- Spacer before button -->
  <div style="margin-top: 30px;"></div>

  <!-- Continue Shopping Button -->
  <a href="{{ url_for('routes.home') }}"
     class="btn"
     style="
       background-color: var(--red);
       color: white;
       padding: 12px 32px;
       font-size: 1.1rem;
       border-radius: 10px;
       font-weight: 500;
       text-decoration: none;
       box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
       transition: background-color 0.3s ease;
     "
     onmouseover="this.style.backgroundColor='#a32d3a'"
     onmouseout="this.style.backgroundColor='var(--red)'"
  >
    Continue Shopping
  </a>
</div>
{% endblock %}
