
{% extends "layout.html" %}
{% set body_class = "edge-hero" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pf.css') }}">
{% endblock %}

{% block content %}

<div class="signin-container">
  <div class="signin-row">
    <div class="signin-col-left">

      <h2 class="signin-title signin-title-light">Reset Password</h2>

      <form method="POST">

        <label for="email">Email Address</label>
       <input 
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
            class="signin-full-input"
            >

        <button type="submit" class="signin-btn-red signin-btn-match">
            Send Reset Link
        </button>

      </form>

      <div class="signin-link">
        <a href="{{ url_for('routes.login') }}">
            Back to Sign In
        </a>
     </div>

    </div>
  </div>
</div>

<style>

   .signin-btn-match{
    height: 48px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 10px;
  } 
</style>
{% endblock %}
