{% extends "layout.html" %}
{% set body_class = "edge-hero" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pf.css') }}">
{% endblock %}

{% block content %}

<div class="signin-container">
  <div class="signin-row">
    <div class="signin-col-left">

      <h2 class="signin-title">Change Password</h2>

      <form method="POST">

        <label for="password">NEW PASSWORD</label>
        <div class="signin-input-group">
          <input 
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            class="signin-full-input"
          >
          <span class="signin-eye-icon" onclick="togglePassword()">
            <i class="fa fa-eye" id="eyeIcon"></i>
          </span>
        </div>

        <button type="submit" class="signin-btn-red signin-btn-match">
          Update Password
        </button>

      </form>

      <div class="signin-link">
        <a href="{{ url_for('routes.login') }}">
          Back to Sign In
        </a>
      </div>

    </div>
  </div>
</div>

<style>
  .signin-btn-match{
    height: 60px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 10px;
    width: 100%;
    max-width: 260px;
    display: block;
    margin: 24px auto 0;
    line-height: 1.2;
    text-align: center;
  }

  .signin-col-left{
    max-width: 700px;
    margin: 0 auto;
  }

  .signin-title{
    text-align: center;
    margin-bottom: 28px;
  }

  .signin-link{
    margin-top: 22px;
  }


  .signin-title{
  font-size: 28px !important;
  font-weight: 500;
  text-align: center;
  margin-bottom: 24px;
}
</style>

<script>
function togglePassword() {
  const passwordInput = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eyeIcon.classList.remove("fa-eye");
    eyeIcon.classList.add("fa-eye-slash");
  } else {
    passwordInput.type = "password";
    eyeIcon.classList.remove("fa-eye-slash");
    eyeIcon.classList.add("fa-eye");
  }
}
</script>

{% endblock %}
