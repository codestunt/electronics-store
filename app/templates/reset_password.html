{% extends "layout.html" %}
{% set body_class = "edge-hero" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pf.css') }}">
{% endblock %}

{% block content %}

<div class="signin-container">
  <div class="signin-row">
    <div class="signin-col-left" style="margin: 0 auto; max-width: 520px;">

      <h2 class="signin-title">Set New Password</h2>

      <form method="POST">

        <label for="password">New Password</label>
        <div class="signin-input-group">
          <input 
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          >
          <span class="signin-eye-icon" onclick="togglePassword()">
            <i class="fa fa-eye" id="eyeIcon"></i>
          </span>
        </div>

        <button type="submit" class="signin-btn-red">
          Update Password
        </button>

      </form>

      <div style="margin-top: 16px;">
        <a href="{{ url_for('routes.login') }}">
          Back to Sign In
        </a>
      </div>

    </div>
  </div>
</div>

<script>
function togglePassword() {
  const passwordInput = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eyeIcon.classList.remove("fa-eye");
    eyeIcon.classList.add("fa-eye-slash");
  } else {
    passwordInput.type = "password";
    eyeIcon.classList.remove("fa-eye-slash");
    eyeIcon.classList.add("fa-eye");
  }
}
</script>

{% endblock %}
