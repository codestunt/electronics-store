{% extends "layout.html" %}
{% set page_title = 'Digital Gift Card' %}
{% block content %}

<section class="ez-gift">
  <!-- BREADCRUMB -->
  <nav class="ez-gift-bc">
    <a href="{{ url_for('routes.home') }}">Home</a>
    <span>›</span>
    <strong>Accessories</strong>
  </nav>

  <div class="ez-gift-wrap">
    <!-- LEFT: PREVIEW -->
    <aside class="ez-gift-left">
      <div class="ez-gift-card">
        <div class="ez-gift-logo">
          <img src="{{ url_for('static', filename='images/logored.png') }}" alt="ElectroZone Logo">
          <img id="giftPreview"
               src="{{ url_for('static', filename='images/giftcard-dark.png') }}"
               alt="">
          <div class="ez-gift-value" id="giftValue">$100</div>
        </div>
      </div>
    </aside>

    <!-- RIGHT: CONFIGURATOR -->
    <form class="ez-gift-right" method="POST" action="{{ url_for('routes.gift_card') }}">
      <!-- Header like the reference -->
      <h2 class="ez-gift-title">ElectroZone Gift Card</h2>
      <p class="ez-gift-sub">
        There’s no expiration date for gift cards. Gift cards are non-refundable.
      </p>
      <div class="ez-gift-rule"></div>

      <!-- Select design -->
      <div class="ez-gift-group">
        <label class="ez-gift-label">Select design</label>
        <div class="ez-gift-designs" role="radiogroup" aria-label="Gift card design">
          <label class="ez-gift-design">
            <input type="radio" name="design" value="dark"
                   data-preview="{{ url_for('static', filename='images/giftcard-dark.png') }}" checked>
            <img src="{{ url_for('static', filename='images/giftcard-dark_thumb.png') }}" alt="Dark design">
          </label>

          <label class="ez-gift-design">
            <input type="radio" name="design" value="orange"
                   data-preview="{{ url_for('static', filename='images/giftcard-orange.png') }}">
            <img src="{{ url_for('static', filename='images/giftcard-orange_thumb.png') }}" alt="Maroon design">
          </label>

          <label class="ez-gift-design">
            <input type="radio" name="design" value="outline"
                   data-preview="{{ url_for('static', filename='images/giftcard-outline.png') }}">
            <img src="{{ url_for('static', filename='images/giftcard-outline_thumb.png') }}" alt="Outline design">
          </label>
        </div>
      </div>

      <!-- Select amount -->
      <div class="ez-gift-group">
        <label class="ez-gift-label">Select an amount</label>
        <div class="ez-gift-amounts" role="radiogroup" aria-label="Gift amount">
          {% for val in [50,100,200,250,500] %}
          <label class="ez-gift-pill">
            <input type="radio" name="amount" value="{{ val }}" {% if val==100 %}checked{% endif %}>
            ${{ val }}
          </label>
          {% endfor %}

          <label class="ez-gift-pill ez-gift-pill--custom">
            <input type="radio" name="amount" value="custom">
            Custom Amount
          </label>
        </div>

        <!-- Custom amount entry (shown only when “Custom” is selected) -->
        <div class="ez-gift-custom" id="customWrap" hidden>
          <span>$</span>
          <input id="customAmount" type="number" min="5" step="1"
                 placeholder="Enter amount">
        </div>

        <!-- Hidden field sent when custom is chosen (your route reads this) -->
        <input type="hidden" name="custom_amount" id="customAmountHidden" value="">
      </div>

      <!-- Recipient -->
      <div class="ez-gift-group">
        <label class="ez-gift-label">To:</label>
        <input class="ez-gift-input" name="recipient_name" placeholder="Recipient Name" required>
        <input class="ez-gift-input" type="email" name="recipient_email" placeholder="Recipient Email" required>
        <input class="ez-gift-input" type="email" name="recipient_email_confirm" placeholder="Recipient Email Confirmation" required>
      </div>

      <!-- From -->
      <div class="ez-gift-group">
        <label class="ez-gift-label">From:</label>
        <input class="ez-gift-input" name="from_name" placeholder="Your Name" required>
      </div>

      <!-- Message -->
      <div class="ez-gift-group">
        <label class="ez-gift-label">Gift Message:</label>
        <textarea class="ez-gift-textarea" name="message" rows="4" placeholder="Message (Optional)"></textarea>
      </div>

      <!-- Submit -->
      <button class="ez-gift-btn" type="submit">Add To Cart</button>
    </form>
  </div>
</section>

<style>

.ez-gift-bc{

/* ===== Groups & Labels ===== */

<script>
(function () {
  const preview    = document.getElementById('giftPreview');
  const valueTag   = document.getElementById('giftValue');
  const customWrap = document.getElementById('customWrap');
  const customInput  = document.getElementById('customAmount');
  const customHidden = document.getElementById('customAmountHidden');
  const cardContainer = document.querySelector('.ez-gift-card');

  /* ---------- DESIGN SWITCH: change image + background ---------- */
  document.querySelectorAll('input[name="design"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const src = radio.getAttribute('data-preview');
      if (src) preview.src = src;

      // reset: show image, remove red class
      preview.style.display = 'block';
      cardContainer.classList.remove('ez-gift-red');

      if (radio.value === 'dark') {
        cardContainer.style.backgroundColor = '#111';

      } else if (radio.value === 'orange') {
        // Use solid ElectroZone red instead of orange image
        preview.style.display = 'none';
        cardContainer.classList.add('ez-gift-red');
        cardContainer.style.backgroundColor = '#B23850';

      } else if (radio.value === 'outline') {
        cardContainer.style.backgroundColor = 'steelblue';

      } else {
        cardContainer.style.backgroundColor = '#111'; // fallback
      }
    });
  });

  /* ---------- AMOUNT / CUSTOM LOGIC ---------- */
  function refreshAmount() {
    const sel = document.querySelector('input[name="amount"]:checked');
    if (!sel) return;

    if (sel.value === 'custom') {
      customWrap.hidden = false;
      const v = Number(customInput.value || 0);
      valueTag.textContent = v > 0 ? `$${v}` : '$—';
      customHidden.value = v > 0 ? v : '';
    } else {
      customWrap.hidden = true;
      valueTag.textContent = `$${sel.value}`;
      customHidden.value = '';
    }
  }

  document.querySelectorAll('input[name="amount"]').forEach(r => {
    r.addEventListener('change', refreshAmount);
  });
  customInput.addEventListener('input', refreshAmount);

  // Initial state setup
  refreshAmount();
})();
</script>
